[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcospy"

version = "1.0.0"

description = "Open-source AI-powered emulator for the COSPY private framework delivering simulation results in 0.25s."

readme = "README.md"

requires-python = ">=3.9"

dependencies = [
    "numpy>=1.24",
    "torch>=2.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
